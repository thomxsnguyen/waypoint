name: MVP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: waypoint
          POSTGRES_PASSWORD: waypoint_test
          POSTGRES_DB: waypoint_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U waypoint -d waypoint_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://waypoint:waypoint_test@localhost:5432/waypoint_test?sslmode=disable
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Go formatting
        working-directory: backend
        run: test -z "$(gofmt -l .)"
      - name: Go tests, PostgreSQL migrations, and static analysis
        working-directory: backend
        run: |
          go test -race ./...
          go vet ./...
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript, lint, and production build
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint
          npm run build
      - name: Check production has no test login
        working-directory: frontend
        run: |
          if grep -R -l 'e2e-user-a\|Sign in as traveler A' .next/server .next/static; then exit 1; fi
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser journey
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
